# Nginx site for the Delbros portal on ONE EC2 server: the portal (static build) and the API (Node on 127.0.0.1:4000)
# on the same domain. Copy to /etc/nginx/conf.d/delbros-portal.conf, replace portal.delbros.com (UAT: uat-portal.delbros.com),
# then: sudo nginx -t && sudo systemctl reload nginx. Certificates: sudo certbot --nginx -d portal.delbros.com

server {
    listen 80;
    server_name portal.delbros.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name portal.delbros.com;

    ssl_certificate     /etc/letsencrypt/live/portal.delbros.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.delbros.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    server_tokens off;

    # Uploads are max 5 MB (the API checks again).
    client_max_body_size 6m;

    # ── API → Node backend ────────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;                                   # needed for signed download links
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # real client IP (TRUST_PROXY=1)
        proxy_set_header X-Forwarded-Proto $scheme;                    # secure cookies (COOKIE_SECURE=true)
        proxy_read_timeout 60s;
        proxy_request_buffering off;
    }

    # ── Portal (frontend build: Client_Portal_Frontend/dist) ──────────────────────────────────
    root /var/www/delbros-portal;
    index index.html;

    # Runtime settings: never cached, so edits apply at once.
    location = /app-config.json { add_header Cache-Control "no-store" always; try_files $uri =404; }
    # Hashed build files: cache for a year.
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }
    # Screen links (/reset-password, /access-approval/…) open the single-page app.
    location / { add_header Cache-Control "no-cache" always; try_files $uri /index.html; }

    # The upload folder (FILE_DIR) is NOT under this root — files are only served by the API through signed links.
}
